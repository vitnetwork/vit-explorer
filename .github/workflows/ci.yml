name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-build:
    name: TypeScript check + Vite build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npx tsc --noEmit

      - name: Build (Vite)
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  smoke-test:
    name: Smoke test — serve.py health endpoints
    runs-on: ubuntu-latest
    needs: typecheck-and-build

    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install serve dependencies
        run: pip install fastapi uvicorn[standard] aiofiles httpx

      - name: Start serve.py and test health endpoints
        run: |
          uvicorn serve:app --host 0.0.0.0 --port 8000 &
          SERVER_PID=$!
          sleep 3

          echo "Testing /health ..."
          STATUS=$(curl -sf http://localhost:8000/health | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['status'])")
          [ "$STATUS" = "ok" ] || (echo "FAIL: /health returned status=$STATUS" && kill $SERVER_PID && exit 1)

          echo "Testing /ping ..."
          STATUS=$(curl -sf http://localhost:8000/ping | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['status'])")
          [ "$STATUS" = "ok" ] || (echo "FAIL: /ping returned status=$STATUS" && kill $SERVER_PID && exit 1)

          echo "All smoke tests passed."
          kill $SERVER_PID
